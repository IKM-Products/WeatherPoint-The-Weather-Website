<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherPoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="brand">WeatherPoint</div>
            <div class="location">
                <i class="fa-solid fa-location-dot"></i>
                <span id="cityName">Loading...</span>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="cityInput" placeholder="Search Your Location">
            </div>
        </header>

        <main class="weather-display">
            <div class="main-card">
                <div class="weather-main">
                    <div class="condition-icon" id="weatherIcon">
                        <i class="fa-solid fa-sun"></i>
                    </div>
                    <h1 id="temp">--°</h1>
                    <div class="weather-status" id="mainCondition">Fetching...</div>
                </div>
                
                <div class="details-panel">
                    <div class="detail-item">
                        <i class="fa-solid fa-droplet"></i>
                        <span id="detailHumid">--%</span>
                        <small>HUMIDITY</small>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-wind"></i>
                        <span id="detailWind">--km/h</span>
                        <small>WIND SPEED</small>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="day active">
                <span id="current-time">00:00</span>
                <small id="current-day-date">LOADING...</small>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
